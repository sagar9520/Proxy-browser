# Push karte hi APK banta hai: Actions tab -> latest run -> Artifacts -> ProxyGo-debug-apk
# Phir emulator pe app chal ke screenshots "ci-screens" branch pe aate hain.
name: Build APK
on:
  push:
    branches-ignore: [ci-screens]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyGo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  uitest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyGo-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          script: bash ci/uitest.sh com.myfuturecode.proxygo apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: out
      - name: Push screenshots to ci-screens branch
        if: always()
        run: |
          cd out
          git init -q -b ci-screens
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          echo "$GITHUB_SHA" > SHA.txt
          git add -A && git commit -qm "screens ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens
